<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>АРС Стандарты</title>
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="АРС Стандарты">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Inter';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Inter';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/inter-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Inter';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/inter-cyrillic-wght-normal.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}

html,body{height:100%;margin:0;background:#14213D;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#shell{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);background:#14213D}
#app{flex:1 1 auto;min-height:0;background:#F5F6F8;max-width:560px;width:100%;margin:0 auto}
#app nav{padding-bottom:calc(14px + env(safe-area-inset-bottom)) !important}

body{margin:0}
a{color:#14213D}a:hover{color:#2457C5}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vfx-swipe{touch-action:none}
@keyframes vfxUp{0%{transform:translateY(24px);opacity:0}25%{opacity:1}80%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
.vfx-up{animation:vfxUp 1.6s ease-in-out infinite}
@keyframes vfxPulse{0%{box-shadow:0 0 0 0 rgba(242,163,58,0.85)}100%{box-shadow:0 0 0 14px rgba(242,163,58,0)}}
.vfx-pulse{animation:vfxPulse 1.3s ease-out infinite}
button{font-family:inherit}

</style>
</head>
<body>
<div id="shell"><div id="app"></div></div>
<template id="tpl">

<div style="width: 100%; height: 100%; position: relative; overflow: hidden; background: #F5F6F8; font-family: Inter, system-ui, sans-serif; color: #14213D; display: flex; flex-direction: column">

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; border-style: none; border-width: 1px; border-color: #141413">

<!-- ============ BUGUN (HOME) ============ -->
<sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column">
<header style="background: #14213D; color: #FFFFFF; padding: 22px 20px 24px; border-radius: 0 0 28px 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #C9D1E3">АРС СТАНДАРТЫ</span>
<h1 style="margin: 0; font-size: 22px; font-weight: 700">{{greet}}</h1>
<span style="font-size: 13px; color: #C9D1E3">{{today}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px">
<div style="display: flex; align-items: center; gap: 6px; background: {{accent}}; color: #14213D; padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 700">
<svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>
<span>{{points}} ball</span>
</div>
<div style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #C9D1E3">
<svg class="ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"></path></svg>
<span>{{streak}} kun ketma-ket</span>
</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,0.08); border-radius: 20px; padding: 14px 16px">
<div style="position: relative; width: 84px; height: 84px; flex: none">
<svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">
<circle cx="42" cy="42" r="36" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"></circle>
<circle cx="42" cy="42" r="36" fill="none" stroke="{{accent}}" stroke-width="8" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="{{ringOffset}}" transform="rotate(-90 42 42)"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 20px; font-weight: 800">{{doneCount}}/{{stageTotal}}</span>
<span style="font-size: 10px; color: #C9D1E3">bosqich</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 13px; color: #C9D1E3">Bugungi standart</span>
<span style="font-size: 20px; font-weight: 700">{{percent}}% bajarildi</span>
<sc-if value="{{notAllDone}}" hint-placeholder-val="{{true}}">
<span style="font-size: 13px; color: #FFFFFF">Keyingi: <b>{{nextTitle}}</b> · {{nextTime}}</span>
</sc-if>
<sc-if value="{{allDone}}" hint-placeholder-val="{{false}}">
<span style="font-size: 13px; color: #FFFFFF"><b>Barakalla!</b> Bugungi kun namunali oʻtdi.</span>
</sc-if>
</div>
</div>
</header>

<section style="padding: 20px 20px 24px; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Mening ish kunim</h2>
<span style="font-size: 13px; color: #5B6475">Bosqichni bosing</span>
</div>
<sc-for list="{{stages}}" as="s" hint-placeholder-count="8">
<div style="display: flex; gap: 12px">
<div style="display: flex; flex-direction: column; align-items: center; width: 44px; flex: none">
<div style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{s.nodeBg}}; color: {{s.nodeFg}}; border: 2px solid {{s.nodeBorder}}; flex: none">
<sc-if value="{{s.icShirt}}"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 4 6l2 4 2-1v12h8V9l2 1 2-4-5-3a3 3 0 0 1-6 0z"></path></svg></sc-if>
<sc-if value="{{s.icCar}}"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17v-4l2-5h14l2 5v4z"></path><path d="M6 17v2M18 17v2"></path><circle cx="7.5" cy="13.5" r="1"></circle><circle cx="16.5" cy="13.5" r="1"></circle></svg></sc-if>
<sc-if value="{{s.icClock}}"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></sc-if>
<sc-if value="{{s.icDesk}}"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="1.5"></rect><path d="M2 19h20"></path></svg></sc-if>
<sc-if value="{{s.icChat}}"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M8 10h8M8 13h5"></path></svg></sc-if>
<sc-if value="{{s.icPin}}"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg></sc-if>
<sc-if value="{{s.icCup}}"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h12v4a6 6 0 0 1-12 0z"></path><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"></path><path d="M8 3v3M12 3v3"></path></svg></sc-if>
<sc-if value="{{s.icShield}}"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg></sc-if>
<sc-if value="{{s.icAlert}}"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20z"></path><path d="M12 10v4M12 17h.01"></path></svg></sc-if>
<sc-if value="{{s.icFire}}"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"></path></svg></sc-if>
<sc-if value="{{s.icRoad}}"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 4 21M16 3l4 18"></path><path d="M12 4v2M12 10v3M12 17v3"></path></svg></sc-if>
<sc-if value="{{s.icFlag}}"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg></sc-if>
</div>
<div style="width: 2px; flex: 1 1 auto; min-height: 12px; background: {{s.lineColor}}; margin: 4px 0"></div>
</div>
<button type="button" onClick="{{s.open}}" style="flex: 1 1 auto; min-width: 0; text-align: left; background: #FFFFFF; border: 1.5px solid {{s.cardBorder}}; box-shadow: {{s.cardShadow}}; border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; color: #14213D; opacity: {{s.cardOpacity}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 12px; font-weight: 600; color: #5B6475">{{s.time}}</span>
<sc-if value="{{s.done}}"><span style="font-size: 11px; font-weight: 700; background: #E6EBF5; color: #14213D; padding: 3px 8px; border-radius: 999px">Bajarildi</span></sc-if>
<sc-if value="{{s.current}}"><span style="font-size: 11px; font-weight: 700; background: #FDEBD0; color: #7A4A00; padding: 3px 8px; border-radius: 999px">Hozir</span></sc-if>
<sc-if value="{{s.todo}}"><span style="font-size: 11px; font-weight: 700; background: #EEF0F4; color: #5B6475; padding: 3px 8px; border-radius: 999px">Kutilmoqda</span></sc-if>
<sc-if value="{{s.locked}}"><span style="font-size: 11px; font-weight: 700; background: #EEF0F4; color: #5B6475; padding: 3px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Yopiq</span></sc-if>
</div>
<span style="font-size: 16px; font-weight: 700">{{s.title}}</span>
<span style="font-size: 13px; color: #5B6475">{{s.sub}}</span>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 4px">
<div style="flex: 1 1 auto; height: 6px; background: #EEF0F4; border-radius: 999px; overflow: hidden"><div style="height: 6px; width: {{s.barPct}}%; background: {{s.barColor}}; border-radius: 999px"></div></div>
<span style="font-size: 12px; font-weight: 600; color: #5B6475">{{s.count}}</span>
</div>
<sc-if value="{{s.showLock}}"><span style="font-size: 12px; font-weight: 600; color: #B42318; background: #FEF3F2; border-radius: 8px; padding: 6px 8px; margin-top: 4px">{{s.lockMsg}}</span></sc-if>
</button>
</div>
</sc-for>
</section>
</div>
</sc-if>

<!-- ============ BOSQICH (STAGE DETAIL) ============ -->
<sc-if value="{{isStage}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 16px 20px 28px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" onClick="{{goHome}}" aria-label="Orqaga" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E3E7EE; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #14213D">
<svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<span style="font-size: 13px; font-weight: 600; color: #5B6475">Bosqich {{cur.n}} / {{stageTotal}}</span>
<div style="width: 44px; height: 44px"></div>
</div>

<sc-if value="{{cur.isForma}}" hint-placeholder-val="{{false}}">
<div style="background: #FFFFFF; border: 1px solid #E3E7EE; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">Korporativ forma</h2>
<span style="font-size: 13px; color: #5B6475">Nuqtani bosing: har bir detal haqida</span>
</div>
<span style="font-size: 12px; font-weight: 700; background: #FDEBD0; color: #7A4A00; padding: 5px 10px; border-radius: 999px; white-space: nowrap">{{seenCount}}/{{spotTotal}} koʻrildi</span>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3E7EE; border-radius: 18px; display: flex; justify-content: center; padding: 12px 0">
<div style="position: relative; width: 210px; height: 467px">
<img src="img/bdac99dac657118ae37f668fdb635fc7.jpg" alt="Safia korporativ formasidagi xodim, old tomondan" style="width: 210px; height: 467px; display: block; mix-blend-mode: multiply">
<sc-for list="{{spots}}" as="p" hint-placeholder-count="9">
<button type="button" onClick="{{p.open}}" aria-label="{{p.name}}" style="position: absolute; left: {{p.x}}%; top: {{p.y}}%; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; background: {{p.bg}}; color: {{p.fg}}; border: 3px solid #FFFFFF; box-shadow: 0 2px 8px rgba(20,33,61,0.4); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800">{{p.n}}</span>
</button>
</sc-for>
</div>
</div>
<div style="display: flex; gap: 16px; justify-content: center; font-size: 12px; color: #5B6475">
<div style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 50%; background: {{accent}}"></span><span>Koʻrilmagan</span></div>
<div style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #14213D"></span><span>Koʻrildi</span></div>
</div>
</div>
</sc-if>

<sc-if value="{{cur.isCar}}" hint-placeholder-val="{{false}}">
<div style="background: #FFFFFF; border: 1px solid #E3E7EE; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">Xizmat avtomobili</h2>
<span style="font-size: 13px; color: #5B6475">Nuqtani bosing: nimani tekshirish kerak</span>
</div>
<span style="font-size: 12px; font-weight: 700; background: #FDEBD0; color: #7A4A00; padding: 5px 10px; border-radius: 999px; white-space: nowrap">{{carSeenCount}}/{{carTotal}} koʻrildi</span>
</div>
<div style="border: 1px solid #E3E7EE; border-radius: 18px; display: flex; justify-content: center; padding: 10px 0; background: #FFFFFF">
<div style="position: relative; width: 300px; height: 183px">
<img src="img/d40f6f4bba51664e7d8a7fac30616c8c.jpg" alt="Safia xizmat avtomobili Damas" style="width: 300px; height: 183px; display: block">
<sc-for list="{{carSpots}}" as="p" hint-placeholder-count="5">
<button type="button" onClick="{{p.open}}" aria-label="{{p.name}}" style="position: absolute; left: {{p.x}}%; top: {{p.y}}%; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; background: {{p.bg}}; color: {{p.fg}}; border: 3px solid #FFFFFF; box-shadow: 0 2px 8px rgba(20,33,61,0.4); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800">{{p.n}}</span>
</button>
</sc-for>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{cur.isVerifix}}" hint-placeholder-val="{{false}}">
<div style="background: #FFFFFF; border: 1px solid #E3E7EE; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">{{vfxTitle}}</h2>
<span style="font-size: 13px; color: #5B6475">Planshetda oʻzingiz mashq qiling</span>
</div>
<span style="font-size: 12px; font-weight: 700; background: {{vfxChipBg}}; color: {{vfxChipFg}}; padding: 5px 10px; border-radius: 999px; white-space: nowrap">{{vfxStep}}</span>
</div>
<div style="display: flex; gap: 10px; align-items: flex-start; background: {{vfxTipBg}}; border-radius: 14px; padding: 12px">
<svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; color: #14213D; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v4h1"></path></svg>
<span style="font-size: 14px; line-height: 1.45; color: #14213D; font-weight: 500">{{vfxTip}}</span>
</div>
<sc-if value="{{vfxWarn}}" hint-placeholder-val="{{false}}">
<div role="alert" style="display: flex; gap: 10px; align-items: flex-start; background: #FDECE0; border: 1.5px solid #C2570C; border-radius: 14px; padding: 12px">
<svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; color: #9A3F06"><path d="M12 3 2 20h20z"></path><path d="M12 10v4M12 17h.01"></path></svg>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 800; color: #9A3F06">{{vfxWarnTitle}}</span>
<span style="font-size: 13px; line-height: 1.45; color: #14213D">{{vfxWarnText}}</span>
</div>
</div>
</sc-if>
<div style="display: flex; justify-content: center">
<div style="position: relative; width: 300px; height: 500px; border-radius: 18px; overflow: hidden; background: #FFFFFF">

<sc-if value="{{vfx0}}" hint-placeholder-val="{{true}}">
<img src="img/d4dbee60e05f3e94cdac5a59b43eba60.jpg" alt="Verifix planshet, qulflangan ekran" style="width: 300px; height: 500px; display: block">
<button type="button" class="vfx-swipe" aria-label="Ekranni tepaga suring" onPointerDown="{{vfxDown}}" onPointerUp="{{vfxUp}}" onClick="{{vfxKey}}" style="position: absolute; left: 8.33%; top: 8.4%; width: 83.33%; height: 80.1%; background: transparent; border: none; padding: 0; cursor: grab; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; padding-bottom: 22px">
<span class="vfx-up" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.92); color: #14213D; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,0.3)">
<svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.6"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
</span>
<span style="font-size: 12px; font-weight: 700; color: #FFFFFF; background: rgba(20,33,61,0.75); padding: 4px 10px; border-radius: 999px">Tepaga suring</span>
</button>
</sc-if>

<sc-if value="{{vfx1}}" hint-placeholder-val="{{false}}">
<img src="img/e05753aa0ea84d978972a219ae1e39cc.jpg" alt="Verifix planshet, yuzni aniqlash ekrani" style="width: 300px; height: 500px; display: block">
<button type="button" onClick="{{vfxNext}}" aria-label="Yuzni aniqlash" style="position: absolute; left: 48.6%; top: 33%; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<span class="vfx-pulse" style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; background: {{accent}}; color: #14213D; border: 3px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800">2</span>
</button>
</sc-if>

<sc-if value="{{vfx2}}" hint-placeholder-val="{{false}}">

<script>
/* Minimal offline runtime for the АРС Стандарты screen template.
   Supports: {{dotted.path}} holes in text and attributes, <sc-if value>,
   <sc-for list as>, on<Event>="{{fn}}" handlers, DCLogic with state/setState.
   State is saved in localStorage so progress survives app restarts. */
(function () {
  var STORE_KEY = 'ars-standart-state-v1';
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;

  function lookup(scope, path) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    var parts = path.split('.');
    var v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function single(str) {
    var m = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(str);
    return m ? m[1] : null;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) {
      var v = lookup(scope, p);
      return v == null ? '' : String(v);
    });
  }

  function loadState() {
    try { var s = localStorage.getItem(STORE_KEY); return s ? JSON.parse(s) : {}; } catch (e) { return {}; }
  }
  function saveState(st) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch (e) {}
  }

  window.DCLogic = function DCLogic(props) {
    this.props = props || {};
    this.state = loadState();
  };
  window.DCLogic.prototype.setState = function (upd) {
    var patch = typeof upd === 'function' ? upd(this.state) : upd;
    this.state = Object.assign({}, this.state, patch || {});
    saveState(this.state);
    scheduleRender();
  };

  // Build a virtual list of real DOM nodes from template nodes + scope.
  function build(tnode, scope, out) {
    if (tnode.nodeType === 3) {
      out.push(document.createTextNode(interp(tnode.nodeValue, scope)));
      return;
    }
    if (tnode.nodeType !== 1) return;
    var tag = tnode.localName;
    if (tag === 'sc-if') {
      var p = single(tnode.getAttribute('value') || '');
      if (p && lookup(scope, p)) buildChildren(tnode, scope, out);
      return;
    }
    if (tag === 'sc-for') {
      var lp = single(tnode.getAttribute('list') || '');
      var as = tnode.getAttribute('as') || 'item';
      var list = lp ? lookup(scope, lp) : null;
      if (list && list.length) {
        for (var i = 0; i < list.length; i++) {
          var s = Object.create(scope);
          s[as] = list[i];
          buildChildren(tnode, s, out);
        }
      }
      return;
    }
    var el = tnode.namespaceURI && tnode.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(tnode.namespaceURI, tag)
      : document.createElement(tag);
    var handlers = {};
    for (var a = 0; a < tnode.attributes.length; a++) {
      var at = tnode.attributes[a];
      if (/^on[A-Z]/.test(at.name) || /^on[a-z]+$/.test(at.name) && single(at.value)) {
        var fp = single(at.value);
        var fn = fp ? lookup(scope, fp) : null;
        if (typeof fn === 'function') handlers[at.name.slice(2).toLowerCase()] = fn;
        continue;
      }
      if (at.name.indexOf('hint-') === 0) continue;
      el.setAttribute(at.name, interp(at.value, scope));
    }
    el.__h = handlers;
    var kids = [];
    buildChildren(tnode, scope, kids);
    for (var k = 0; k < kids.length; k++) el.appendChild(kids[k]);
    out.push(el);
  }
  function buildChildren(tnode, scope, out) {
    var c = tnode.childNodes;
    for (var i = 0; i < c.length; i++) build(c[i], scope, out);
  }

  function dispatch(e) {
    var h = e.currentTarget.__h;
    var fn = h && h[e.type];
    if (fn) fn(e);
  }
  var EVENTS = ['click', 'pointerdown', 'pointerup', 'pointermove', 'pointercancel', 'input', 'change', 'touchstart', 'touchend'];
  function bindEvents(el) {
    if (el.__bound) return;
    el.__bound = true;
    for (var i = 0; i < EVENTS.length; i++) el.addEventListener(EVENTS[i], dispatch);
  }

  // Patch live DOM `cur` to match freshly built `nxt` (same position).
  function patch(parent, curList, nxtList) {
    var i;
    for (i = 0; i < nxtList.length; i++) {
      var cur = curList[i], nxt = nxtList[i];
      if (!cur) { parent.appendChild(prepare(nxt)); continue; }
      if (cur.nodeType !== nxt.nodeType || cur.nodeName !== nxt.nodeName) {
        parent.replaceChild(prepare(nxt), cur);
        continue;
      }
      if (cur.nodeType === 3) {
        if (cur.nodeValue !== nxt.nodeValue) cur.nodeValue = nxt.nodeValue;
        continue;
      }
      // attributes
      var na = nxt.attributes, ca = cur.attributes, j;
      for (j = ca.length - 1; j >= 0; j--) if (!nxt.hasAttribute(ca[j].name)) cur.removeAttribute(ca[j].name);
      for (j = 0; j < na.length; j++) if (cur.getAttribute(na[j].name) !== na[j].value) cur.setAttribute(na[j].name, na[j].value);
      cur.__h = nxt.__h;
      bindEvents(cur);
      patch(cur, Array.prototype.slice.call(cur.childNodes), Array.prototype.slice.call(nxt.childNodes));
    }
    for (var r = curList.length - 1; r >= nxtList.length; r--) parent.removeChild(curList[r]);
  }
  function prepare(node) {
    if (node.nodeType === 1) {
      bindEvents(node);
      var all = node.querySelectorAll('*');
      for (var i = 0; i < all.length; i++) if (all[i].__h) bindEvents(all[i]);
    }
    return node;
  }

  var root, tpl, comp, pending = false;
  function render() {
    pending = false;
    var vals = comp.renderVals();
    var out = [];
    buildChildren(tpl, vals, out);
    patch(root, Array.prototype.slice.call(root.childNodes), out);
  }
  function scheduleRender() {
    if (pending) return;
    pending = true;
    (window.requestAnimationFrame || setTimeout)(render);
  }

  window.startApp = function (Component, props) {
    root = document.getElementById('app');
    tpl = document.getElementById('tpl').content;
    comp = new Component(props);
    render();
  };
})();

</script>

      seenCount: countSeen('forma'), carSpots: carSpots, carSeenCount: countSeen('car'), carTotal: CAR_SPOTS.length, sheetTotal: SETS[curSet].length,
      sheetOpen: spi >= 0 && st.screen === 'stage',
      closeSpot: function () { self.setState({ spot: null }); },
      nextSpot: function () { openSpot(curSet, spi + 1); },
      prevSpot: function () { openSpot(curSet, spi - 1); },
      accent: accent,
      isHome: st.screen === 'home', isStage: st.screen === 'stage', isRules: st.screen === 'rules',
      isQuiz: st.screen === 'quiz', isProfile: st.screen === 'profile',
      goHome: go('home'), goRules: go('rules'), goQuiz: go('quiz'), goProfile: go('profile'),
      navHome: nav('home'), navRules: nav('rules'), navQuiz: nav('quiz'), navProfile: nav('profile'),
      points: points, doneCount: doneCount, percent: pct,
      ringOffset: (226.2 * (1 - doneCount / STAGES.length)).toFixed(1),
      allDone: doneCount === STAGES.length, notAllDone: doneCount < STAGES.length, stageTotal: STAGES.length,
      nextTitle: nextIdx >= 0 ? STAGES[nextIdx].title : '', nextTime: nextIdx >= 0 ? STAGES[nextIdx].time : '',
      stages: stages, cur: cur,
      quizRunning: !st.quizEnd, quizEnd: st.quizEnd,
      qNum: st.qi + 1, qTotal: QUIZ.length, qPct: Math.round((st.qi + (answered ? 1 : 0)) / QUIZ.length * 100),
      qText: q.q, qWhy: q.why, options: options, answered: answered,
      fbTitle: wasRight ? 'Toʻgʻri! +10 ball' : 'Unchalik emas', fbColor: wasRight ? '#1D4AAE' : '#9A3F06', fbBg: wasRight ? '#E6EEFB' : '#FDECE0',
      nextLabel: last ? 'Natijani koʻrish' : 'Keyingi savol',
      nextQ: function () { if (last) self.setState({ quizEnd: true }); else self.setState({ qi: st.qi + 1, picked: null }); },
      score: st.score,
      scoreText: st.score === QUIZ.length ? 'Aʼlo! Siz standartlarni mukammal bilasiz.' : 'Yaxshi! Qoidalar boʻlimini yana bir bor koʻrib chiqing.',
      restartQuiz: function () { self.setState({ qi: 0, picked: null, score: 0, quizEnd: false }); },
      levelPct: Math.min(100, Math.round(points / 300 * 100)),
      week: week,
      badges: BADGES.map(function (b) { return { name: b.name, bg: b.on ? accent : '#EEF0F4', fg: b.on ? '#14213D' : '#9AA2B2', text: b.on ? '#14213D' : '#5B6475' }; })
    };
  }
}

/* Real-device additions: date, streak, week, badges, profile name, reset. */
var UZ_DAYS = ['Yakshanba', 'Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba'];
var UZ_MONTHS = ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'];
function dayKey(d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

class App extends Component {
  constructor(props) {
    super(props);
    var days = Object.assign({}, this.state.days || {});
    days[dayKey(new Date())] = true;
    this.state = Object.assign({}, this.state, { days: days, spot: null });
    try { localStorage.setItem('ars-standart-state-v1', JSON.stringify(this.state)); } catch (e) {}
  }
  renderVals() {
    var self = this;
    var v = super.renderVals();
    var st = this.state || {};
    var now = new Date();
    var h = now.getHours();
    v.greet = h < 5 ? 'Xayrli tun!' : h < 12 ? 'Xayrli tong!' : h < 18 ? 'Xayrli kun!' : 'Xayrli kech!';
    v.today = UZ_DAYS[now.getDay()] + ', ' + now.getDate() + '-' + UZ_MONTHS[now.getMonth()];

    var days = st.days || {};
    var streak = 0, d = new Date(now);
    while (days[dayKey(d)]) { streak++; d.setDate(d.getDate() - 1); }
    v.streak = streak;

    // week bars: Monday..Saturday of this week, filled on days the app was used
    var monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    v.week = ['Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh'].map(function (name, i) {
      var day = new Date(monday); day.setDate(monday.getDate() + i);
      var isToday = dayKey(day) === dayKey(now);
      var used = !!days[dayKey(day)];
      return { d: name, h: isToday ? Math.max(8, v.percent) : (used ? 100 : 8), color: isToday ? v.accent : (used ? '#C9D3EA' : '#EEF0F4') };
    });

    // best quiz result
    var best = st.best || 0;
    if (st.quizEnd && st.score > best) { best = st.score; this.state.best = best; try { localStorage.setItem('ars-standart-state-v1', JSON.stringify(this.state)); } catch (e) {} }
    v.bestQuiz = best + '/' + QUIZ.length;

    var done = st.done || {};
    var earned = [
      !!done.kelish, !!done.kiyim, !!done.transport,
      v.allDone, best === QUIZ.length, streak >= 20
    ];
    v.badges = BADGES.map(function (b, i) {
      var on = !!earned[i];
      return { name: b.name, bg: on ? v.accent : '#EEF0F4', fg: on ? '#14213D' : '#9AA2B2', text: on ? '#14213D' : '#5B6475' };
    });

    var p = v.points;
    var levels = [[0, 'Yangi xodim'], [60, 'Oʻrganuvchi'], [140, 'Standart ustasi'], [220, 'Oltin standart']];
    var li = 0; for (var i = 0; i < levels.length; i++) if (p >= levels[i][0]) li = i;
    v.levelNum = li + 1; v.levelName = levels[li][1];
    v.levelNext = li < levels.length - 1 ? 'Keyingi daraja: “' + levels[li + 1][1] + '” · ' + levels[li + 1][0] + ' ball' : 'Eng yuqori daraja!';

    v.userName = st.userName || 'Ismingizni kiriting';
    v.userRole = st.userRole || 'Avariya taʼmirlash brigadasi';
    var nm = (st.userName || 'АРС').trim().split(/\s+/);
    v.initials = ((nm[0] || '').charAt(0) + (nm[1] || '').charAt(0)).toUpperCase() || 'А';
    v.editProfile = function () {
      var n = window.prompt('Ism va familiyangiz:', st.userName || '');
      if (n === null) return;
      var r = window.prompt('Lavozim va filial (masalan: Elektrik · Chilonzor):', st.userRole || '');
      self.setState({ userName: n.trim(), userRole: r === null ? st.userRole : r.trim() });
    };
    v.resetAll = function () {
      if (!window.confirm('Barcha belgilangan bosqichlar va test natijalari oʻchiriladi. Davom etasizmi?')) return;
      var keep = { userName: st.userName, userRole: st.userRole, days: st.days };
      self.state = {};
      self.setState(Object.assign(keep, { screen: 'home' }));
    };
    return v;
  }
}
startApp(App, {});

</script>

  navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(function (r) { r.update(); });
  var hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadCtl) location.reload(); });
}
